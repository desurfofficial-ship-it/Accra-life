name: CI

# Guards the main branch: every push and PR must typecheck cleanly
# (Vite does NOT typecheck at build time) and produce a working bundle.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests
        run: npm run test:all

      - name: Build (vite build)
        run: npm run build

      - name: Lint security rules
        run: npm run lint
