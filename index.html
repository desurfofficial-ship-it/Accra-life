<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>CHALÉ LIFE — Accra</title>
<style>:root{--gta-black:#0a0a0a;--gta-panel:#080808e6;--gta-yellow:#fc0;--gta-green:#6f6;--gta-red:#f44;--gta-white:#f0f0f0;--gta-muted:#9a9a9a}*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{width:100%;height:100%;color:var(--gta-white);background:#0a0a0a;margin:0;padding:0;font-family:Arial Narrow,Arial,sans-serif;overflow:hidden}#viewportContainer{position:fixed;inset:0}#onboardingOverlay{z-index:1000;opacity:0;pointer-events:none;background:linear-gradient(#0a0a0a,#2a1a0c);justify-content:center;align-items:center;padding:24px;transition:opacity .35s;display:flex;position:fixed;inset:0}#onboardingOverlay.visible{opacity:1;pointer-events:auto}#onboardingOverlay.exit{opacity:0;pointer-events:none}.ob-card{text-align:center;width:100%;max-width:420px}.ob-screen{flex-direction:column;align-items:center;gap:12px;display:none}.ob-screen.active{display:flex}.ob-place{letter-spacing:.28em;color:var(--gta-yellow);margin:0;font-size:.75rem;font-weight:700}.ob-title{text-transform:uppercase;text-shadow:3px 3px #000;margin:0;font-size:2.8rem;font-weight:900}.ob-tagline{color:var(--gta-muted);font-size:1rem}.ob-tagline em{color:var(--gta-yellow);font-style:normal;font-weight:800}.ob-divider{background:var(--gta-yellow);width:60px;height:3px}.ob-btn{cursor:pointer;text-transform:uppercase;border:2px solid #0000;width:100%;max-width:320px;padding:14px 24px;font-family:inherit;font-size:1rem;font-weight:900}.ob-btn-primary{background:var(--gta-yellow);color:#0a0a0a;border-color:#000;box-shadow:4px 4px #000}.ob-btn-secondary{color:#fff;background:0 0;border:2px solid #ffffff59}.ob-btn-ghost{color:var(--gta-muted);background:0 0;border:none;font-size:.78rem}.ob-input{color:#fff;background:#000;border:2px solid #fc06;width:100%;max-width:320px;padding:12px;font-family:inherit;font-size:1rem}.ob-error{color:var(--gta-red);font-size:.8rem;font-weight:800;display:none}.ob-error.visible{display:block}.ob-back{color:var(--gta-muted);cursor:pointer;text-transform:uppercase;background:0 0;border:none;align-self:flex-start;font-weight:800}.ob-chip-row{flex-wrap:wrap;justify-content:center;gap:8px;max-width:340px;display:flex}.ob-chip{color:#fff;cursor:pointer;text-transform:uppercase;background:#000;border:2px solid #fff3;padding:10px 14px;font-family:inherit;font-size:.78rem;font-weight:900}.ob-chip.selected{border-color:var(--gta-yellow);color:var(--gta-yellow);background:#ffcc002e}.ob-hint{color:var(--gta-muted);margin:0;font-size:.75rem}.ob-spinner{border:3px solid #fc03;border-top-color:var(--gta-yellow);border-radius:50%;width:36px;height:36px;animation:.6s linear infinite s}@keyframes s{to{transform:rotate(360deg)}}.phase1-hud-top{z-index:20;pointer-events:none;justify-content:space-between;display:flex;position:fixed;top:8px;left:8px;right:8px}.objective-banner{background:var(--gta-panel);border:1px solid #ffffff26;border-left:3px solid var(--gta-green);padding:6px 8px;pointer-events:auto;max-width:220px;display:none}.objective-banner.visible{display:block!important}.objective-banner.risky{border-left-color:var(--gta-red)}.hud-right-stack{flex-direction:column;align-items:flex-end;gap:4px;display:flex}.hud-top-actions{pointer-events:auto;gap:4px;display:flex}.wallet-chip{background:var(--gta-panel);color:var(--gta-green);cursor:pointer;border:1px solid #66ff6673;padding:4px 9px;font-family:inherit;font-weight:900}.jobs-btn,.cam-btn{background:var(--gta-yellow);color:#000;cursor:pointer;border:1px solid #000;padding:5px 10px;font-family:inherit;font-size:.72rem;font-weight:900}.cam-btn{color:#fff;background:#1a1a1a}.needs-stack{background:var(--gta-panel);border:1px solid #ffffff1f;min-width:96px;padding:4px 7px}.need-row{align-items:center;gap:5px;font-size:.65rem;font-weight:800;display:flex}.need-bar{background:#222;flex:1;height:5px}.need-fill{background:var(--gta-green);height:100%}.need-fill.low{background:var(--gta-red)}.heat-pill{color:var(--gta-muted);padding:2px 7px;font-size:.64rem;font-weight:900}.heat-pill.suspicious{color:var(--gta-yellow)}.heat-pill.wanted,.heat-pill.arrested{color:var(--gta-red)}#interactionPrompt{background:var(--gta-panel);z-index:25;opacity:0;pointer-events:auto;cursor:pointer;text-align:center;border:1.5px solid #ffcc008c;padding:7px 14px;position:fixed;bottom:92px;left:50%;transform:translate(-50%)}#interactionPrompt.visible{opacity:1}#promptTitle{color:var(--gta-yellow);margin:0;font-size:.86rem;font-weight:900}#interactionToast{z-index:60;opacity:0;pointer-events:none;background:#080808;border:1.5px solid #66ff6673;padding:8px 14px;font-weight:800;position:fixed;top:16%;left:50%;transform:translate(-50%)}#interactionToast.visible,#interactionToast.show{opacity:1}#interactionToast.warn{border-color:var(--gta-red);color:#ffd6d6}#walletDeltaFloating{z-index:60;opacity:0;pointer-events:none;font-size:1.15rem;font-weight:900;position:fixed;top:24%;left:50%;transform:translate(-50%)}#walletDeltaFloating.show-gain{opacity:1;color:var(--gta-green)}#walletDeltaFloating.show-loss{opacity:1;color:var(--gta-red)}.economy-modal-backdrop{z-index:50;background:#000000c7;justify-content:center;align-items:center;padding:12px;display:none;position:fixed;inset:0}.economy-modal-backdrop.open{display:flex}.economy-modal{background:#111;border:2px solid #ffcc0073;width:100%;max-width:440px;max-height:85vh;overflow:auto}.modal-header{border-bottom:1px solid #ffffff1f;justify-content:space-between;align-items:center;padding:11px 14px;display:flex}.modal-tabs{display:flex}.modal-tab-btn{color:var(--gta-muted);cursor:pointer;background:#0a0a0a;border:none;flex:1;padding:10px;font-family:inherit;font-size:.72rem;font-weight:900}.modal-tab-btn.active{color:var(--gta-yellow);border-bottom:2px solid var(--gta-yellow)}.modal-body{padding:12px;display:flex;flex-direction:column;gap:8px}.econ-card{background:#181818;border:1px solid #ffffff24;padding:10px 12px;display:flex;flex-direction:column;gap:5px}.econ-card.risky{border-color:#ff444466}.econ-card-title{font-size:.88rem;font-weight:900;color:#fff}.econ-pay-badge{background:#66ff6624;border:1px solid #66ff6666;color:var(--gta-green);font-weight:900;font-size:.74rem;padding:2px 6px}.econ-pay-badge.risky{background:#ff444426;border-color:#ff444473;color:#ff8888}.econ-req-list{display:flex;flex-wrap:wrap;gap:5px}.econ-req-item{font-size:.64rem;font-weight:800;padding:2px 6px;background:#66ff661a;border:1px solid #66ff664d;color:var(--gta-green)}.econ-req-item.unmet{background:#ff44441f;border-color:#ff444466;color:#ff8888}.econ-cooldown-row{font-size:.64rem;font-weight:800;color:var(--gta-muted)}.econ-cooldown-row.active{color:var(--gta-yellow)}.econ-action-btn{align-self:flex-start;background:var(--gta-yellow);color:#0a0a0a;border:1px solid #000;padding:6px 12px;font-weight:900;font-size:.73rem;cursor:pointer;text-transform:uppercase;font-family:inherit}.econ-action-btn:disabled{background:#2a2a2a;color:#777;border-color:#3a3a3a;cursor:not-allowed}.home-modal-backdrop{z-index:55;background:#000000bf;justify-content:center;align-items:flex-end;display:none;position:fixed;inset:0}.home-modal-backdrop.open{display:flex}.home-sheet{border-top:3px solid var(--gta-yellow);background:#111;width:100%;max-width:480px;max-height:78vh;padding:14px;overflow:auto}.furn-row{background:#1a1a1a;border:1px solid #ffffff1f;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.furn-row.owned{border-color:#66ff6659}.furn-title{margin:0;font-size:.8rem;font-weight:900}.furn-blurb{margin:2px 0 0;font-size:.66rem;color:var(--gta-muted)}.furn-buy{background:var(--gta-yellow);color:#000;border:1px solid #000;padding:5px 10px;font-weight:900;font-size:.7rem;cursor:pointer;text-transform:uppercase}.furn-buy:disabled{background:#2a2a2a;color:var(--gta-green);cursor:default}.touch-controls{pointer-events:none;z-index:15;justify-content:space-between;padding:0 12px;display:flex;position:fixed;bottom:12px;left:0;right:0}.joystick-zone{pointer-events:auto;background:#ffffff0f;border:2px solid #ffffff26;border-radius:50%;width:110px;height:110px;position:relative}.joystick-knob{background:#ffcc00d9;border-radius:50%;width:44px;height:44px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}.action-buttons-right{pointer-events:auto;flex-direction:column;gap:8px;display:flex}.ctrl-btn{color:#fff;cursor:pointer;background:#000000bf;border:2px solid #ffffff47;padding:12px 16px;font-family:inherit;font-size:.75rem;font-weight:900}</style>
</head>
<body>
<div id="viewportContainer"></div>
<div id="onboardingOverlay">
  <div class="ob-card">
    <div id="obScreenWelcome" class="ob-screen active">
      <p class="ob-place">ACCRA</p>
      <h1 class="ob-title">CHALÉ<br/>LIFE</h1>
      <div class="ob-divider"></div>
      <p class="ob-tagline">Your second life in the capital.<br/><em>Earn. Eat. Rest. Flex.</em></p>
      <button id="obBtnGuest" class="ob-btn ob-btn-primary" type="button">Enter Accra</button>
      <button id="obBtnAccount" class="ob-btn ob-btn-secondary" type="button">Save Progress</button>
    </div>
    <div id="obScreenAuth" class="ob-screen">
      <button id="obBackFromAuth" class="ob-back" type="button">← Back</button>
      <h2 id="obAuthTitle" class="ob-title" style="font-size:1.6rem">Keep Your Story</h2>
      <input id="obEmailInput" class="ob-input" type="email" placeholder="Email"/>
      <input id="obPasswordInput" class="ob-input" type="password" placeholder="Password (min 6)"/>
      <p id="obError" class="ob-error"></p>
      <button id="obAuthSubmit" class="ob-btn ob-btn-primary" type="button">Create Account</button>
      <button id="obAuthToggle" class="ob-btn ob-btn-ghost" type="button">Already have an account? Sign in</button>
    </div>
    <div id="obScreenName" class="ob-screen">
      <button id="obBackFromName" class="ob-back" type="button">← Back</button>
      <p class="ob-place">WHO YOU BE</p>
      <h2 class="ob-title" style="font-size:1.6rem">Your Name</h2>
      <input id="obNameInput" class="ob-input" type="text" placeholder="e.g. Kofi, Ama, Chale…" value="Chale" maxlength="24"/>
      <p id="obNameError" class="ob-error"></p>
      <button id="obBtnNameNext" class="ob-btn ob-btn-primary" type="button">Next</button>
    </div>
    <div id="obScreenLook" class="ob-screen">
      <button id="obBackFromLook" class="ob-back" type="button">← Back</button>
      <p class="ob-place">LOOK</p>
      <h2 class="ob-title" style="font-size:1.6rem">Skin & Hair</h2>
      <p class="ob-hint">Pick skin tone</p>
      <div id="obSkinRow" class="ob-chip-row">
        <button class="ob-chip" data-skin="deep" type="button">Deep</button>
        <button class="ob-chip selected" data-skin="rich" type="button">Rich</button>
        <button class="ob-chip" data-skin="warm" type="button">Warm</button>
        <button class="ob-chip" data-skin="light" type="button">Light</button>
      </div>
      <p class="ob-hint">Pick hair</p>
      <div id="obHairRow" class="ob-chip-row">
        <button class="ob-chip selected" data-hair="fade" type="button">Fade</button>
        <button class="ob-chip" data-hair="twists" type="button">Twists</button>
        <button class="ob-chip" data-hair="bun" type="button">Bun</button>
        <button class="ob-chip" data-hair="short" type="button">Short</button>
      </div>
      <button id="obBtnLookNext" class="ob-btn ob-btn-primary" type="button">Next</button>
    </div>
    <div id="obScreenTrait" class="ob-screen">
      <button id="obBackFromTrait" class="ob-back" type="button">← Back</button>
      <p class="ob-place">TRAIT</p>
      <h2 class="ob-title" style="font-size:1.6rem">How You Move</h2>
      <div id="obTraitRow" class="ob-chip-row"></div>
      <button id="obBtnTraitNext" class="ob-btn ob-btn-primary" type="button">Next</button>
    </div>
    <div id="obScreenOrigin" class="ob-screen">
      <button id="obBackFromOrigin" class="ob-back" type="button">← Back</button>
      <p class="ob-place">ORIGIN</p>
      <h2 class="ob-title" style="font-size:1.6rem">Where You Start</h2>
      <div id="obOriginRow" class="ob-chip-row">
        <button class="ob-chip" data-origin="dbee" type="button">DBee</button>
        <button class="ob-chip selected" data-origin="aunty_ba" type="button">Aunty Ba</button>
      </div>
      <button id="obBtnEnter" class="ob-btn ob-btn-primary" type="button">Enter Accra</button>
    </div>
    <div id="obScreenLoading" class="ob-screen">
      <div class="ob-spinner"></div>
      <p class="ob-place" style="color:var(--gta-yellow)">Loading Accra…</p>
      <p id="obLoadingName" class="ob-hint"></p>
    </div>
  </div>
</div>
<div class="phase1-hud-top">
  <div id="activeObjectiveBanner" class="objective-banner" style="display:none"></div>
  <div class="hud-right-stack">
    <div class="hud-top-actions">
      <button id="walletOpenBtn" class="wallet-chip" type="button"><span id="hudCashAmount">₵0</span></button>
      <button id="workMenuOpenBtn" class="jobs-btn" type="button">Jobs</button>
      <button id="resetCameraBtn" class="cam-btn" type="button">Cam</button>
    </div>
    <div class="needs-stack">
      <div class="need-row"><span>H</span><div class="need-bar"><div id="hungerFill" class="need-fill" style="width:70%"></div></div><span id="hungerVal">70</span></div>
      <div class="need-row"><span>E</span><div class="need-bar"><div id="energyFill" class="need-fill" style="width:80%"></div></div><span id="energyVal">80</span></div>
    </div>
    <div id="heatStatusPill" class="heat-pill"><span id="heatStatusText">◆ CLEAN</span></div>
  </div>
</div>
<div id="interactionPrompt"><p id="promptTitle"></p><p id="promptSub" class="prompt-sub"></p></div>
<div id="interactionToast"></div>
<div id="walletDeltaFloating"></div>
<div id="economyModalBackdrop" class="economy-modal-backdrop">
  <div class="economy-modal">
    <div class="modal-header"><h2 id="modalHeaderTitle">Work</h2><button id="modalCloseBtn" type="button" style="background:none;border:none;color:#999;font-size:1.3rem;cursor:pointer">×</button></div>
    <div class="modal-tabs">
      <button class="modal-tab-btn active" data-tab="jobs" type="button">Jobs</button>
      <button class="modal-tab-btn" data-tab="hustles" type="button">Hustles</button>
      <button class="modal-tab-btn" data-tab="spend" type="button">Spend</button>
      <button class="modal-tab-btn" data-tab="wallet" type="button">Wallet</button>
    </div>
    <div id="modalBodyContent" class="modal-body"></div>
  </div>
</div>
<div id="homeModalBackdrop" class="home-modal-backdrop">
  <div class="home-sheet">
    <h2>My Compound</h2>
    <p id="homeFlexScore" style="font-size:.75rem;color:#9a9a9a">Flex score: 0</p>
    <div id="furnGrid"></div>
    <button id="homeModalClose" type="button" style="margin-top:10px;width:100%;background:#222;color:#fff;border:1px solid #444;padding:10px;font-weight:900;cursor:pointer">Close</button>
  </div>
</div>
<div class="touch-controls">
  <div id="joystickZone" class="joystick-zone"><div id="joystickKnob" class="joystick-knob"></div></div>
  <div class="action-buttons-right">
    <button id="sprintToggleBtn" class="ctrl-btn" type="button">Jog</button>
    <button id="interactTriggerBtn" class="ctrl-btn" type="button">Act</button>
  </div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
