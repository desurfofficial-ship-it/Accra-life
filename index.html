<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Life in Accra</title>
  <meta name="description" content="Live your story in Accra. Hustle, visit friends, send money, build your life." />
  <meta name="theme-color" content="#0c1017" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0c1017;--surface:#161d2a;--surface2:#1f2a3d;--accent:#f59e0b;--accent-hover:#fbbf24;--green:#10b981;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;--radius:14px;--shadow:0 6px 24px rgba(0,0,0,.45)}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45;-webkit-tap-highlight-color:transparent}
    .app{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
    header{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px;flex-wrap:wrap;gap:10px}
    .logo{font-size:1.4rem;font-weight:700}.logo span{color:var(--accent)}
    .header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .day-info{font-size:.9rem;color:var(--muted)}
    button{background:var(--surface2);border:none;color:var(--text);padding:9px 14px;border-radius:11px;font-family:inherit;font-weight:500;cursor:pointer;transition:.18s;font-size:.88rem}
    button:hover{background:var(--accent);color:#111}button.primary{background:var(--accent);color:#111;font-weight:600}
    button:disabled{opacity:.45;cursor:not-allowed}button.small{padding:7px 11px;font-size:.82rem}
    .char-bar{background:var(--surface);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:var(--shadow)}
    .char-name{font-weight:600;font-size:1.05rem}.char-job{font-size:.85rem;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
    @media(min-width:640px){.stats{grid-template-columns:repeat(6,1fr)}}
    .stat{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
    .stat-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
    .stat-value{font-size:1.15rem;font-weight:600}.stat-bar{height:5px;background:var(--surface2);border-radius:3px;margin-top:6px;overflow:hidden}
    .stat-bar-fill{height:100%;border-radius:3px;transition:width .35s}.money .stat-value{color:var(--accent)}
    .hunger .stat-bar-fill{background:#f97316}.energy .stat-bar-fill{background:#3b82f6}.happy .stat-bar-fill{background:#ec4899}
    .social .stat-bar-fill{background:#8b5cf6}.health .stat-bar-fill{background:var(--green)}
    .main{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:900px){.main{grid-template-columns:1fr 300px}}
    .location-card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
    .location-emoji{font-size:2.2rem}.location-name{font-size:1.3rem;font-weight:600}.location-desc{color:var(--muted);font-size:.9rem;margin-top:4px}
    .panel{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
    .panel h3{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
    .action-btn{background:var(--surface2);border:1px solid transparent;padding:12px 10px;border-radius:11px;text-align:left;display:flex;flex-direction:column;gap:3px}
    .action-btn:hover{border-color:var(--accent);background:#2a3a52}.action-btn .title{font-weight:600;font-size:.9rem}.action-btn .cost{font-size:.75rem;color:var(--muted)}
    .sidebar{display:flex;flex-direction:column;gap:12px}
    .locations-list,.friends-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
    .loc-btn,.friend-btn{background:var(--surface2);text-align:left;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:.9rem}
    .loc-btn.active,.friend-btn.active{background:var(--accent);color:#111;font-weight:600}
    .loc-btn:hover:not(.active),.friend-btn:hover:not(.active){background:#2a3a52}
    .friend-btn .bal{margin-left:auto;font-size:.8rem;color:var(--muted)}
    .log{max-height:180px;overflow-y:auto;font-size:.82rem}.log-entry{padding:5px 0;border-bottom:1px solid var(--surface2);color:var(--muted)}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);padding:11px 20px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:.3s;z-index:200;font-weight:500;font-size:.9rem;max-width:90%;text-align:center}.toast.show{opacity:1}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:150;padding:16px}.modal-overlay.show{display:flex}
    .modal{background:var(--surface);border-radius:18px;padding:24px;max-width:400px;width:100%;box-shadow:var(--shadow)}
    .modal h2{margin-bottom:10px;font-size:1.25rem}.modal p{color:var(--muted);margin-bottom:14px;font-size:.95rem}
    .modal input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--surface2);background:var(--bg);color:var(--text);font-family:inherit;font-size:1rem;margin-bottom:12px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
    footer{text-align:center;padding:28px 0 10px;color:var(--muted);font-size:.82rem}footer a{color:var(--accent);text-decoration:none}
    .stat.low .stat-value{color:var(--danger);animation:pulse 1.2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    .npc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">Life in <span>Accra</span></div>
      <div class="header-right">
        <span class="day-info" id="dayInfo">Day 1 • Morning</span>
        <button class="small" onclick="saveGame()">Save</button>
        <button class="small" onclick="loadGame()">Load</button>
        <button class="small" onclick="showSummary()">Summary</button>
        <button class="small primary" onclick="promptNewGame()">New Life</button>
      </div>
    </header>

    <div class="char-bar">
      <div>
        <div class="char-name" id="charName">New Resident</div>
        <div class="char-job" id="charJob">Unemployed</div>
      </div>
      <button class="small" onclick="showCareerModal()">Career</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="main">
      <div class="left">
        <div class="location-card" id="locationCard"></div>
        <div class="panel"><h3>Actions</h3><div class="actions" id="actions"></div></div>
        <div class="panel" id="npcPanel" style="display:none">
          <h3 id="npcTitle">Visiting</h3>
          <div id="npcInfo" style="color:var(--muted);font-size:.9rem;margin-bottom:8px"></div>
          <div class="npc-actions" id="npcActions"></div>
        </div>
        <div class="panel">
          <h3>Career</h3>
          <div class="career-info" id="careerInfo" style="font-size:.9rem;margin-bottom:8px"></div>
          <div id="careerActions"></div>
        </div>
      </div>
      <div class="sidebar">
        <div class="panel"><h3>Travel</h3><div class="locations-list" id="locationsList"></div></div>
        <div class="panel"><h3>Friends & Houses</h3><div class="friends-list" id="friendsList"></div></div>
        <div class="panel"><h3>Life Log</h3><div class="log" id="log"></div></div>
      </div>
    </div>

    <footer>
      Life in Accra<br>
      <a href="https://desurfofficial-ship-it.github.io/lagos-life-ghana/">Play</a> • <a href="https://github.com/desurfofficial-ship-it/lagos-life-ghana">GitHub</a>
    </footer>
  </div>

  <div class="modal-overlay" id="nameModal">
    <div class="modal">
      <h2>Start Your Life in Accra</h2>
      <p>What should we call you?</p>
      <input type="text" id="nameInput" placeholder="e.g. Kwame, Ama, Abena..." maxlength="24" />
      <div class="modal-actions"><button class="primary" onclick="startNewLife()">Begin</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="careerModal">
    <div class="modal">
      <h2>Choose Career</h2>
      <div id="careerOptions" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px"></div>
      <div class="modal-actions"><button onclick="closeCareerModal()">Cancel</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="sendModal">
    <div class="modal">
      <h2>Send Money</h2>
      <p id="sendToText">Send to friend</p>
      <input type="number" id="sendAmount" placeholder="Amount in ₵" min="1" />
      <div class="modal-actions">
        <button onclick="closeSendModal()">Cancel</button>
        <button class="primary" onclick="confirmSend()">Send</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="summaryModal">
    <div class="modal">
      <h2>Life Summary</h2>
      <div id="summaryBody" style="color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:16px"></div>
      <div class="modal-actions"><button onclick="closeSummary()">Close</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const LOCATIONS = {
      home:{name:"Your Flat (Osu)",emoji:"🏠",desc:"Your place in Osu.",actions:["sleep","cook","watch","clean"]},
      makola:{name:"Makola Market",emoji:"🛒",desc:"The commercial heart of Accra.",actions:["buy_food","sell","bargain","load_goods"]},
      labadi:{name:"Labadi Beach",emoji:"🏖️",desc:"Sand, sea, and reset energy.",actions:["swim","relax","kelewele","party"]},
      square:{name:"Independence Square",emoji:"🇬🇭",desc:"Black Star Square.",actions:["reflect","photo","meet"]},
      legon:{name:"University of Ghana",emoji:"🎓",desc:"Legon campus.",actions:["study","lecture","network"]},
      kaneshie:{name:"Kaneshie",emoji:"🥬",desc:"Fresh food and real Accra energy.",actions:["banku","hustle","gist"]},
      tech:{name:"Tech Hub",emoji:"💻",desc:"Where the builders gather.",actions:["code","pitch","freelance"]},
      church:{name:"Church",emoji:"⛪",desc:"Community and peace.",actions:["worship","fellowship","donate"]},
      mall:{name:"Accra Mall",emoji:"🏬",desc:"Shopping and cinema.",actions:["shop","cinema","foodcourt"]},
      circle:{name:"Circle",emoji:"🚌",desc:"Kwame Nkrumah Circle.",actions:["street_food","side_hustle","observe"]}
    };

    const ACTIONS = {
      sleep:{title:"Sleep",cost:"Energy +++",fn:()=>{change("energy",50);change("hunger",-12);advanceTime(8);log("You slept well.");}},
      cook:{title:"Cook",cost:"₵6",fn:()=>{if(spend(6)){change("hunger",40);change("happy",8);log("Home-cooked meal.");}}},
      watch:{title:"Watch TV",cost:"Happy +",fn:()=>{change("happy",18);change("energy",-6);advanceTime(2);log("You relaxed with a show.");}},
      clean:{title:"Clean",cost:"Happy +",fn:()=>{change("happy",10);change("health",5);change("energy",-10);log("Place feels better.");}},
      buy_food:{title:"Street food",cost:"₵12",fn:()=>{if(spend(12)){change("hunger",42);change("happy",10);log("Waakye hit different.");}}},
      sell:{title:"Sell goods",cost:"Earn ₵25-60",fn:()=>{const e=25+Math.floor(Math.random()*36);change("money",e);change("energy",-18);log(`Sold goods for ₵${e}.`);}},
      bargain:{title:"Bargain",cost:"Skill",fn:()=>{if(Math.random()>0.35){change("money",18);log("Good bargain.");}else{change("happy",-5);log("They held firm.");}}},
      load_goods:{title:"Load goods",cost:"Earn ₵15",fn:()=>{change("money",15);change("energy",-20);log("Helped load goods.");}},
      swim:{title:"Swim",cost:"Health +",fn:()=>{change("energy",-16);change("health",18);change("happy",22);log("Ocean reset.");}},
      relax:{title:"Chill",cost:"Happy ++",fn:()=>{change("happy",28);change("energy",12);log("Beach therapy.");}},
      kelewele:{title:"Kelewele",cost:"₵8",fn:()=>{if(spend(8)){change("hunger",28);change("happy",18);log("Spicy kelewele.");}}},
      party:{title:"Party",cost:"₵35",fn:()=>{if(spend(35)){change("social",35);change("happy",30);change("energy",-25);log("Good night out.");}}},
      reflect:{title:"Reflect",cost:"Happy +",fn:()=>{change("happy",16);log("Quiet moment at the Square.");}},
      photo:{title:"Photos",cost:"Happy +",fn:()=>{change("happy",12);log("Snapped some shots.");}},
      meet:{title:"Meet people",cost:"Social ++",fn:()=>{change("social",26);log("New connections.");}},
      study:{title:"Study",cost:"Energy -",fn:()=>{change("energy",-22);change("happy",6);if(state.career==="student")change("money",8);log("Studied hard.");}},
      lecture:{title:"Lecture",cost:"Energy -",fn:()=>{change("energy",-16);change("social",12);log("Attended lecture.");}},
      network:{title:"Network",cost:"Social +++",fn:()=>{change("social",32);change("energy",-12);log("Network grew.");}},
      banku:{title:"Banku & Tilapia",cost:"₵28",fn:()=>{if(spend(28)){change("hunger",55);change("happy",22);change("health",6);log("Banku and tilapia.");}}},
      hustle:{title:"Side hustle",cost:"Earn ₵18-40",fn:()=>{const e=18+Math.floor(Math.random()*23);change("money",e);change("energy",-20);log(`Hustle paid ₵${e}.`);}},
      gist:{title:"Catch gist",cost:"Social +",fn:()=>{change("social",20);change("happy",10);log("Got the latest gist.");}},
      code:{title:"Code",cost:"Energy --",fn:()=>{change("energy",-28);if(Math.random()>0.45){const e=45+Math.floor(Math.random()*70);change("money",e);log(`Shipped work for ₵${e}.`);}else log("Coded for hours.");}},
      pitch:{title:"Pitch",cost:"Risk",fn:()=>{if(Math.random()>0.55){change("money",120);change("happy",35);log("Pitch went well!");}else{change("happy",-12);log("Pitch missed.");}}},
      freelance:{title:"Freelance",cost:"Earn ₵60-140",fn:()=>{const e=60+Math.floor(Math.random()*81);change("money",e);change("energy",-32);log(`Freelance: ₵${e}.`);}},
      worship:{title:"Service",cost:"Happy ++",fn:()=>{change("happy",28);change("social",16);log("Service was uplifting.");}},
      fellowship:{title:"Fellowship",cost:"Social ++",fn:()=>{change("social",28);change("happy",16);log("Good fellowship.");}},
      donate:{title:"Give",cost:"₵20",fn:()=>{if(spend(20)){change("happy",18);log("You gave.");}}},
      shop:{title:"Shop",cost:"₵20-80",fn:()=>{const c=20+Math.floor(Math.random()*61);if(spend(c)){change("happy",20);log(`Spent ₵${c}.`);}}},
      cinema:{title:"Cinema",cost:"₵45",fn:()=>{if(spend(45)){change("happy",30);change("social",8);log("Watched a film.");}}},
      foodcourt:{title:"Food court",cost:"₵35",fn:()=>{if(spend(35)){change("hunger",45);change("happy",12);log("Ate at the mall.");}}},
      street_food:{title:"Street food",cost:"₵10",fn:()=>{if(spend(10)){change("hunger",35);change("happy",8);log("Quick bite.");}}},
      side_hustle:{title:"Quick hustle",cost:"Earn ₵12-30",fn:()=>{const e=12+Math.floor(Math.random()*19);change("money",e);change("energy",-14);log(`Quick ₵${e}.`);}},
      observe:{title:"Observe",cost:"Insight",fn:()=>{change("happy",12);log("Watched the city move.");}}
    };

    const CAREERS = {
      unemployed:{name:"Unemployed",pay:0,desc:"Pure hustle.",reqMoney:0},
      trader:{name:"Market Trader",pay:35,desc:"Buy and sell.",reqMoney:80},
      developer:{name:"Developer",pay:70,desc:"Build software.",reqMoney:0},
      teacher:{name:"Teacher",pay:45,desc:"Teach the next generation.",reqMoney:0},
      musician:{name:"Musician",pay:30,desc:"Create and perform.",reqMoney:40},
      driver:{name:"Driver",pay:40,desc:"Move people around Accra.",reqMoney:100},
      student:{name:"Student",pay:10,desc:"Focus on learning.",reqMoney:0}
    };

    // NPC friends with houses and wallets
    const DEFAULT_FRIENDS = [
      {id:"ama",name:"Ama",house:"Ama's Place (Adenta)",emoji:"🏡",money:220,affinity:40,bio:"Works in banking. Always has good advice."},
      {id:"kofi",name:"Kofi",house:"Kofi's Spot (Tema)",emoji:"🏠",money:150,affinity:35,bio:"Mechanic and side hustler. Loyal friend."},
      {id:"abena",name:"Abena",house:"Abena's Flat (East Legon)",emoji:"🏢",money:310,affinity:50,bio:"Runs a small boutique. Generous when she can."},
      {id:"kwame",name:"Kwame",house:"Kwame's Room (Madina)",emoji:"👨🏻",money:90,affinity:30,bio:"Student and part-time rider. Always grinding."},
      {id:"efua",name:"Efua",house:"Efua's Home (Dansoman)",emoji:"👩🏻",money:180,affinity:45,bio:"Teacher by day, highlife lover by night."}
    ];

    let state = {
      name:"New Resident",day:1,time:0,location:"home",career:"unemployed",
      money:180,hunger:75,energy:85,happy:65,social:45,health:90,
      visiting:null, // friend id or null
      friends:JSON.parse(JSON.stringify(DEFAULT_FRIENDS)),
      log:[]
    };

    const TIME = ["Morning","Afternoon","Evening","Night"];
    let sendTarget = null;

    function clamp(v){return Math.max(0,Math.min(100,Math.round(v)));}
    function change(stat,amt){if(stat==="money")state.money=Math.max(0,Math.round(state.money+amt));else state[stat]=clamp(state[stat]+amt);}
    function spend(amt){if(state.money<amt){toast("Not enough ₵");return false;}state.money-=amt;return true;}
    function log(msg){state.log.unshift(`Day ${state.day}: ${msg}`);if(state.log.length>50)state.log.pop();}
    function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("show"),2600);}

    function advanceTime(hrs=2){
      state.time += Math.ceil(hrs/3.5);
      while(state.time>=4){
        state.time-=4;state.day++;
        change("hunger",-18);change("energy",-8);change("social",-4);change("happy",-3);
        const pay=CAREERS[state.career]?.pay||0;
        if(pay>0){change("money",pay);log(`Career pay +₵${pay}`);}
        // friends also earn a little
        state.friends.forEach(f=>{f.money += 10 + Math.floor(Math.random()*25);});
        log(`— Day ${state.day} —`);
      }
      if(Math.random()<0.16)randomEvent();
      checkCritical();
      render();
    }

    function randomEvent(){
      const events=[
        ()=>{change("money",35);log("MoMo from family. +₵35");},
        ()=>{change("happy",-15);change("energy",-10);log("Long traffic and delay.");},
        ()=>{const f=state.friends[Math.floor(Math.random()*state.friends.length)];f.affinity=Math.min(100,f.affinity+8);log(`${f.name} checked up on you.`);},
        ()=>{change("health",-10);log("Feeling under the weather.");},
        ()=>{change("happy",20);log("Good song on the radio. Mood up.");},
        ()=>{change("money",-15);log("Small expenses added up.");},
        ()=>{
          const f=state.friends.filter(x=>x.affinity>40)[0];
          if(f && f.money>30 && Math.random()>0.5){
            const amt=15+Math.floor(Math.random()*25);
            f.money-=amt;change("money",amt);f.affinity+=5;
            log(`${f.name} sent you ₵${amt}.`);
          }
        }
      ];
      events[Math.floor(Math.random()*events.length)]();
    }

    function checkCritical(){
      if(state.hunger<=5){change("health",-8);toast("You're starving");}
      if(state.energy<=5)toast("Exhausted — sleep");
      if(state.health<=15)toast("Health is low");
    }

    function render(){
      document.getElementById("charName").textContent=state.name;
      document.getElementById("charJob").textContent=CAREERS[state.career]?.name||"Unemployed";

      const stats=[
        {key:"money",label:"Wallet",val:`₵${state.money}`,cls:"money"},
        {key:"hunger",label:"Hunger",val:state.hunger,cls:"hunger"},
        {key:"energy",label:"Energy",val:state.energy,cls:"energy"},
        {key:"happy",label:"Happy",val:state.happy,cls:"happy"},
        {key:"social",label:"Social",val:state.social,cls:"social"},
        {key:"health",label:"Health",val:state.health,cls:"health"}
      ];
      document.getElementById("stats").innerHTML=stats.map(s=>{
        const low=s.key!=="money"&&s.val<20?" low":"";
        const bar=s.key==="money"?"":`<div class="stat-bar"><div class="stat-bar-fill" style="width:${s.val}%"></div></div>`;
        return `<div class="stat ${s.cls}${low}"><div class="stat-label">${s.label}</div><div class="stat-value">${s.val}</div>${bar}</div>`;
      }).join("");

      document.getElementById("dayInfo").textContent=`Day ${state.day} • ${TIME[state.time]}`;

      // Location or NPC house
      const npcPanel=document.getElementById("npcPanel");
      if(state.visiting){
        const f=state.friends.find(x=>x.id===state.visiting);
        document.getElementById("locationCard").innerHTML=`
          <div class="location-emoji">${f.emoji}</div>
          <div class="location-name">${f.house}</div>
          <div class="location-desc">${f.bio}</div>`;
        document.getElementById("actions").innerHTML="";
        npcPanel.style.display="block";
        document.getElementById("npcTitle").textContent=`With ${f.name}`;
        document.getElementById("npcInfo").innerHTML=`Wallet: ₵${f.money} &nbsp;•&nbsp; Friendship: ${f.affinity}/100`;
        document.getElementById("npcActions").innerHTML=`
          <button class="small primary" onclick="openSend('${f.id}')">Send Money</button>
          <button class="small" onclick="chatFriend('${f.id}')">Chat</button>
          <button class="small" onclick="hangOut('${f.id}')">Hang out</button>
          <button class="small" onclick="leaveFriend()">Leave</button>`;
      } else {
        const loc=LOCATIONS[state.location];
        document.getElementById("locationCard").innerHTML=`
          <div class="location-emoji">${loc.emoji}</div>
          <div class="location-name">${loc.name}</div>
          <div class="location-desc">${loc.desc}</div>`;
        document.getElementById("actions").innerHTML=loc.actions.map(k=>{
          const a=ACTIONS[k];return `<button class="action-btn" onclick="doAction('${k}')"><span class="title">${a.title}</span><span class="cost">${a.cost}</span></button>`;
        }).join("");
        npcPanel.style.display="none";
      }

      const c=CAREERS[state.career];
      document.getElementById("careerInfo").textContent=`${c.name} — ${c.desc}${c.pay?` (+₵${c.pay}/day)`:""}`;
      document.getElementById("careerActions").innerHTML=`<button class="small" onclick="showCareerModal()">Switch</button>${state.career!=="unemployed"?` <button class="small" onclick="workShift()">Work shift</button>`:""}`;

      document.getElementById("locationsList").innerHTML=Object.entries(LOCATIONS).map(([k,l])=>
        `<button class="loc-btn ${!state.visiting&&k===state.location?"active":""}" onclick="travel('${k}')"><span>${l.emoji}</span><span>${l.name}</span></button>`
      ).join("");

      document.getElementById("friendsList").innerHTML=state.friends.map(f=>
        `<button class="friend-btn ${state.visiting===f.id?"active":""}" onclick="visitFriend('${f.id}')">
          <span>${f.emoji}</span><span>${f.name}</span>
          <span class="bal">₵${f.money}</span>
        </button>`
      ).join("");

      document.getElementById("log").innerHTML=state.log.slice(0,10).map(e=>`<div class="log-entry">${e}</div>`).join("")||`<div class="log-entry">Your life in Accra begins...</div>`;
    }

    function doAction(key){
      if(state.energy<8&&key!=="sleep"){toast("Too tired");return;}
      if(state.time===3&&key!=="sleep"){toast("It's night. Go sleep.");return;}
      ACTIONS[key].fn();
      if(key!=="sleep")advanceTime(2);else render();
    }

    function travel(key){
      if(state.visiting){state.visiting=null;}
      if(key===state.location&&!state.visiting)return;
      if(state.energy<10){toast("Too tired to move");return;}
      if(state.time===3){toast("Night. Stay home.");return;}
      state.location=key;state.visiting=null;
      change("energy",-8);change("money",-3);
      log(`Went to ${LOCATIONS[key].name}`);
      advanceTime(1);
    }

    function visitFriend(id){
      if(state.energy<10){toast("Too tired");return;}
      if(state.time===3){toast("Too late to visit");return;}
      const f=state.friends.find(x=>x.id===id);
      state.visiting=id;state.location="home"; // conceptual
      change("energy",-10);change("money",-5);
      change("social",8);
      log(`Visited ${f.name} at ${f.house}`);
      advanceTime(1);
    }

    function leaveFriend(){
      state.visiting=null;
      log("You left and headed back.");
      render();
    }

    function chatFriend(id){
      const f=state.friends.find(x=>x.id===id);
      f.affinity=Math.min(100,f.affinity+6);
      change("social",15);change("happy",10);change("energy",-5);
      log(`Had a good chat with ${f.name}.`);
      advanceTime(1);
    }

    function hangOut(id){
      const f=state.friends.find(x=>x.id===id);
      if(state.energy<15){toast("Too tired");return;}
      f.affinity=Math.min(100,f.affinity+12);
      change("social",25);change("happy",18);change("energy",-15);
      log(`Hung out with ${f.name}. Good times.`);
      advanceTime(2);
    }

    function openSend(id){
      sendTarget=id;
      const f=state.friends.find(x=>x.id===id);
      document.getElementById("sendToText").textContent=`Send money to ${f.name} (they have ₵${f.money})`;
      document.getElementById("sendAmount").value="";
      document.getElementById("sendModal").classList.add("show");
    }
    function closeSendModal(){document.getElementById("sendModal").classList.remove("show");sendTarget=null;}
    function confirmSend(){
      const amt=Math.floor(Number(document.getElementById("sendAmount").value));
      if(!amt||amt<1){toast("Enter a valid amount");return;}
      if(amt>state.money){toast("You don't have enough");return;}
      const f=state.friends.find(x=>x.id===sendTarget);
      state.money-=amt;
      f.money+=amt;
      f.affinity=Math.min(100,f.affinity+Math.min(20,Math.floor(amt/10)));
      change("social",8);change("happy",5);
      log(`You sent ₵${amt} to ${f.name}.`);
      closeSendModal();
      render();
      toast(`Sent ₵${amt} to ${f.name}`);
    }

    function workShift(){
      if(state.energy<25){toast("Too tired");return;}
      const pay=Math.round((CAREERS[state.career].pay||20)*1.4);
      change("money",pay);change("energy",-30);
      log(`Worked a shift. +₵${pay}`);
      advanceTime(4);
    }

    function showCareerModal(){
      document.getElementById("careerOptions").innerHTML=Object.entries(CAREERS).map(([k,c])=>{
        const locked=c.reqMoney&&state.money<c.reqMoney;
        return `<button style="text-align:left;padding:12px" ${locked?"disabled":""} onclick="setCareer('${k}')"><strong>${c.name}</strong>${c.pay?` • ₵${c.pay}/day`:""}<br><span style="font-size:.8rem;color:var(--muted)">${c.desc}${locked?` (Need ₵${c.reqMoney})`:""}</span></button>`;
      }).join("");
      document.getElementById("careerModal").classList.add("show");
    }
    function closeCareerModal(){document.getElementById("careerModal").classList.remove("show");}
    function setCareer(key){
      const c=CAREERS[key];
      if(c.reqMoney&&state.money<c.reqMoney){toast("Not enough money");return;}
      if(c.reqMoney)change("money",-c.reqMoney);
      state.career=key;log(`Started as ${c.name}`);closeCareerModal();render();
    }

    function showSummary(){
      const c=CAREERS[state.career];
      const topFriends=state.friends.slice().sort((a,b)=>b.affinity-a.affinity).slice(0,3).map(f=>`${f.name} (${f.affinity})`).join(", ");
      document.getElementById("summaryBody").innerHTML=`
        <strong>${state.name}</strong><br>Day ${state.day} • ${c.name}<br><br>
        Wallet: ₵${state.money}<br>
        Hunger ${state.hunger} • Energy ${state.energy}<br>
        Happy ${state.happy} • Social ${state.social} • Health ${state.health}<br><br>
        Closest friends: ${topFriends}`;
      document.getElementById("summaryModal").classList.add("show");
    }
    function closeSummary(){document.getElementById("summaryModal").classList.remove("show");}

    function promptNewGame(){
      if(state.day>1&&!confirm("Start fresh? Unsaved progress will be lost."))return;
      document.getElementById("nameInput").value="";
      document.getElementById("nameModal").classList.add("show");
    }
    function startNewLife(){
      const name=document.getElementById("nameInput").value.trim()||"Accra Resident";
      state={
        name,day:1,time:0,location:"home",career:"unemployed",visiting:null,
        money:180,hunger:75,energy:85,happy:65,social:45,health:90,
        friends:JSON.parse(JSON.stringify(DEFAULT_FRIENDS)),
        log:[`Welcome ${name}. This is your life in Accra.`]
      };
      document.getElementById("nameModal").classList.remove("show");
      render();toast(`Welcome, ${name}`);
    }

    function saveGame(){localStorage.setItem("lifeInAccra",JSON.stringify(state));toast("Saved");}
    function loadGame(){
      const raw=localStorage.getItem("lifeInAccra");
      if(!raw){toast("No save found");return;}
      try{state=JSON.parse(raw);if(!state.friends)state.friends=JSON.parse(JSON.stringify(DEFAULT_FRIENDS));render();toast("Loaded");}catch(e){toast("Load failed");}
    }

    if(!localStorage.getItem("lifeInAccra")){
      document.getElementById("nameModal").classList.add("show");
    }else{
      try{state=JSON.parse(localStorage.getItem("lifeInAccra"));if(!state.friends)state.friends=JSON.parse(JSON.stringify(DEFAULT_FRIENDS));}catch(e){}
    }
    render();
  </script>
</body>
</html>
