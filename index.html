<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Accra Life — Ghana Life Simulation</title>
  <meta name="description" content="Live your Ghanaian story. Superior life simulation set in Accra — careers, culture, hustle. Better than Lagos Life." />
  <meta name="theme-color" content="#0f1419" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0c1017;--surface:#161d2a;--surface2:#1f2a3d;--accent:#f59e0b;--accent-hover:#fbbf24;--green:#10b981;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;--radius:14px;--shadow:0 6px 24px rgba(0,0,0,.45)}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Outfit',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45;-webkit-tap-highlight-color:transparent}
    .app{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
    header{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px;flex-wrap:wrap;gap:10px}
    .logo{font-size:1.45rem;font-weight:700;letter-spacing:-.4px}.logo span{color:var(--accent)}
    .header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .day-info{font-size:.9rem;color:var(--muted);white-space:nowrap}
    button{background:var(--surface2);border:none;color:var(--text);padding:9px 14px;border-radius:11px;font-family:inherit;font-weight:500;cursor:pointer;transition:all .18s;font-size:.88rem;white-space:nowrap}
    button:hover{background:var(--accent);color:#111}button.primary{background:var(--accent);color:#111;font-weight:600}button.primary:hover{background:var(--accent-hover)}
    button:disabled{opacity:.45;cursor:not-allowed}button.small{padding:7px 11px;font-size:.82rem}
    .char-bar{background:var(--surface);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:var(--shadow)}
    .char-name{font-weight:600;font-size:1.05rem}.char-job{font-size:.85rem;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
    @media(min-width:640px){.stats{grid-template-columns:repeat(6,1fr)}}
    .stat{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
    .stat-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
    .stat-value{font-size:1.15rem;font-weight:600;margin-top:1px}
    .stat-bar{height:5px;background:var(--surface2);border-radius:3px;margin-top:6px;overflow:hidden}
    .stat-bar-fill{height:100%;border-radius:3px;transition:width .35s ease}
    .money .stat-value{color:var(--accent)}.hunger .stat-bar-fill{background:#f97316}.energy .stat-bar-fill{background:#3b82f6}
    .happy .stat-bar-fill{background:#ec4899}.social .stat-bar-fill{background:#8b5cf6}.health .stat-bar-fill{background:var(--green)}
    .main{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:860px){.main{grid-template-columns:1fr 300px}}
    .location-card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
    .location-emoji{font-size:2.2rem;margin-bottom:4px}.location-name{font-size:1.3rem;font-weight:600}.location-desc{color:var(--muted);font-size:.9rem;margin-top:4px}
    .panel{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
    .panel h3{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
    .action-btn{background:var(--surface2);border:1px solid transparent;padding:12px 10px;border-radius:11px;text-align:left;display:flex;flex-direction:column;gap:3px}
    .action-btn:hover{border-color:var(--accent);background:#2a3a52}.action-btn .title{font-weight:600;font-size:.9rem}.action-btn .cost{font-size:.75rem;color:var(--muted)}
    .sidebar{display:flex;flex-direction:column;gap:12px}
    .locations-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
    .loc-btn{background:var(--surface2);text-align:left;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:.9rem}
    .loc-btn.active{background:var(--accent);color:#111;font-weight:600}.loc-btn:hover:not(.active){background:#2a3a52}
    .log{max-height:200px;overflow-y:auto;font-size:.82rem}.log-entry{padding:5px 0;border-bottom:1px solid var(--surface2);color:var(--muted)}.log-entry:last-child{border-bottom:none}
    .career-info{font-size:.9rem;margin-bottom:8px}.career-actions{display:flex;flex-wrap:wrap;gap:6px}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);padding:11px 20px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .3s;z-index:200;pointer-events:none;font-weight:500;font-size:.9rem;max-width:90%;text-align:center}.toast.show{opacity:1}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:150;padding:16px}.modal-overlay.show{display:flex}
    .modal{background:var(--surface);border-radius:18px;padding:24px;max-width:400px;width:100%;box-shadow:var(--shadow)}
    .modal h2{margin-bottom:10px;font-size:1.25rem}.modal p{color:var(--muted);margin-bottom:16px;font-size:.95rem}
    .modal input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--surface2);background:var(--bg);color:var(--text);font-family:inherit;font-size:1rem;margin-bottom:14px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
    footer{text-align:center;padding:28px 0 10px;color:var(--muted);font-size:.82rem}footer a{color:var(--accent);text-decoration:none}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}.stat.low .stat-value{color:var(--danger);animation:pulse 1.2s infinite}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">Accra <span>Life</span></div>
      <div class="header-right">
        <span class="day-info" id="dayInfo">Day 1 • Morning</span>
        <button class="small" onclick="saveGame()">Save</button>
        <button class="small" onclick="loadGame()">Load</button>
        <button class="small" onclick="showSummary()">Summary</button>
        <button class="small primary" onclick="promptNewGame()">New Life</button>
      </div>
    </header>

    <div class="char-bar">
      <div>
        <div class="char-name" id="charName">New Ghanaian</div>
        <div class="char-job" id="charJob">Unemployed</div>
      </div>
      <button class="small" onclick="showCareerModal()">Change Career</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="main">
      <div class="left">
        <div class="location-card" id="locationCard"></div>
        <div class="panel"><h3>Actions</h3><div class="actions" id="actions"></div></div>
        <div class="panel">
          <h3>Career</h3>
          <div class="career-info" id="careerInfo"></div>
          <div class="career-actions" id="careerActions"></div>
        </div>
      </div>
      <div class="sidebar">
        <div class="panel"><h3>Travel (Trotro)</h3><div class="locations-list" id="locationsList"></div></div>
        <div class="panel"><h3>Life Log</h3><div class="log" id="log"></div></div>
      </div>
    </div>

    <footer>
      Accra Life — Better Ghanaian alternative to Lagos Life<br>
      <a href="https://desurfofficial-ship-it.github.io/lagos-life-ghana/">Play Live</a> • <a href="https://github.com/desurfofficial-ship-it/lagos-life-ghana" target="_blank">GitHub</a>
    </footer>
  </div>

  <div class="modal-overlay" id="nameModal">
    <div class="modal">
      <h2>Start Your Accra Life</h2>
      <p>What is your name?</p>
      <input type="text" id="nameInput" placeholder="e.g. Kwame, Ama, Kofi..." maxlength="24" />
      <div class="modal-actions"><button class="primary" onclick="startNewLife()">Begin Life</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="careerModal">
    <div class="modal">
      <h2>Choose a Career</h2>
      <p>Some careers need startup money.</p>
      <div id="careerOptions" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px"></div>
      <div class="modal-actions"><button onclick="closeCareerModal()">Cancel</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="summaryModal">
    <div class="modal">
      <h2>Life Summary</h2>
      <div id="summaryBody" style="color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:16px"></div>
      <div class="modal-actions"><button onclick="closeSummary()">Close</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const LOCATIONS = {
      home:{name:"Your Flat (Osu)",emoji:"🏠",desc:"Your base in Osu after long Accra days.",actions:["sleep","cook","watch","invite","clean"]},
      makola:{name:"Makola Market",emoji:"🛒",desc:"Commercial heartbeat of Accra. Bargain or get played.",actions:["buy_food","sell","chat","bargain","load_goods"]},
      labadi:{name:"Labadi Beach",emoji:"🏖️",desc:"Atlantic breeze and pure reset vibes.",actions:["swim","relax","kelewele","party","jog"]},
      square:{name:"Independence Square",emoji:"🇬🇭",desc:"Black Star Square. Pride and the nation's pulse.",actions:["reflect","photo","meet","rally"]},
      legon:{name:"University of Ghana",emoji:"🎓",desc:"Legon — ambition and the next generation.",actions:["study","lecture","network","library"]},
      kaneshie:{name:"Kaneshie",emoji:"🥬",desc:"Fresh produce, banku, and real-side energy.",actions:["ingredients","banku","hustle","gist"]},
      tech:{name:"Tech Hub (iSpace)",emoji:"💻",desc:"Silicon Accra. Code, pitch, ship.",actions:["code","pitch","meetup","freelance"]},
      church:{name:"Church",emoji:"⛪",desc:"Community and spiritual grounding.",actions:["worship","fellowship","donate","pray"]},
      mall:{name:"Accra Mall",emoji:"🏬",desc:"Shopping, cinema, food court.",actions:["shop","cinema","foodcourt","window"]},
      circle:{name:"Kwame Nkrumah Circle",emoji:"🚌",desc:"Transport chaos and street energy.",actions:["trotro_spot","street_food","observe","side_hustle"]}
    };

    const ACTIONS = {
      sleep:{title:"Sleep",cost:"Energy +++",fn:()=>{change("energy",50);change("hunger",-12);advanceTime(8);log("Deep sleep. You wake refreshed.");}},
      cook:{title:"Cook meal",cost:"₵6",fn:()=>{if(spend(6)){change("hunger",40);change("happy",8);log("Home-cooked food hits different.");}}},
      watch:{title:"Watch shows",cost:"Happy +",fn:()=>{change("happy",18);change("energy",-6);advanceTime(2);log("Ghanaian series / football highlights.");}},
      invite:{title:"Host friend",cost:"Social ++",fn:()=>{change("social",28);change("happy",12);change("energy",-12);log("Good company and shared stories.");}},
      clean:{title:"Clean flat",cost:"Happy + Health +",fn:()=>{change("happy",10);change("health",5);change("energy",-10);log("Clean space, clear mind.");}},
      buy_food:{title:"Street food",cost:"₵12",fn:()=>{if(spend(12)){change("hunger",42);change("happy",10);log("Waakye + shito + egg.");}}},
      sell:{title:"Sell goods",cost:"Earn ₵25-60",fn:()=>{const e=25+Math.floor(Math.random()*36);change("money",e);change("energy",-18);change("social",6);log(`Hustle: ₵${e} made.`);}},
      chat:{title:"Chat traders",cost:"Social +",fn:()=>{change("social",22);change("happy",6);log("Market contacts secured.");}},
      bargain:{title:"Bargain",cost:"Skill check",fn:()=>{if(Math.random()>0.35){change("money",18);log("Sharp bargaining!");}else{change("happy",-6);log("Trader won this round.");}}},
      load_goods:{title:"Help load goods",cost:"Earn ₵15",fn:()=>{change("money",15);change("energy",-20);change("health",-3);log("Hard work, honest pay.");}},
      swim:{title:"Swim",cost:"Health + Happy +",fn:()=>{change("energy",-16);change("health",18);change("happy",22);log("Atlantic waves reset your spirit.");}},
      relax:{title:"Beach chill",cost:"Happy ++",fn:()=>{change("happy",28);change("energy",12);log("Sun, sand, zero stress.");}},
      kelewele:{title:"Kelewele",cost:"₵8",fn:()=>{if(spend(8)){change("hunger",28);change("happy",18);log("Spicy kelewele — pure joy.");}}},
      party:{title:"Beach party",cost:"₵35",fn:()=>{if(spend(35)){change("social",35);change("happy",30);change("energy",-25);log("Music, dance, new friends.");}}},
      jog:{title:"Morning jog",cost:"Health +",fn:()=>{change("health",12);change("energy",-12);change("happy",8);log("Beachside jog.");}},
      reflect:{title:"Reflect",cost:"Happy +",fn:()=>{change("happy",16);log("Pride in the Black Star.");}},
      photo:{title:"Take photos",cost:"Happy +",fn:()=>{change("happy",12);log("Clean shots of the Square.");}},
      meet:{title:"Meet people",cost:"Social ++",fn:()=>{change("social",26);log("Interesting conversations.");}},
      rally:{title:"Join discussion",cost:"Social +",fn:()=>{change("social",18);change("happy",8);log("You engaged in discourse.");}},
      study:{title:"Study",cost:"Energy -",fn:()=>{change("energy",-22);change("happy",6);if(state.career==="student")change("money",8);log("Focused study session.");}},
      lecture:{title:"Lecture",cost:"Energy -",fn:()=>{change("energy",-16);change("social",12);log("Solid lecture.");}},
      network:{title:"Network",cost:"Social +++",fn:()=>{change("social",32);change("energy",-12);log("Network grows.");}},
      library:{title:"Library",cost:"Focus +",fn:()=>{change("energy",6);change("happy",10);log("Quiet hours. Mind sharpened.");}},
      ingredients:{title:"Buy ingredients",cost:"₵14",fn:()=>{if(spend(14)){change("hunger",8);log("Fresh ingredients secured.");}}},
      banku:{title:"Banku & Tilapia",cost:"₵28",fn:()=>{if(spend(28)){change("hunger",55);change("happy",22);change("health",6);log("Banku and tilapia — the real thing.");}}},
      hustle:{title:"Side hustle",cost:"Earn ₵18-40",fn:()=>{const e=18+Math.floor(Math.random()*23);change("money",e);change("energy",-20);log(`Side hustle: ₵${e}.`);}},
      gist:{title:"Catch gist",cost:"Social +",fn:()=>{change("social",20);change("happy",10);log("Fully updated on Accra gist.");}},
      code:{title:"Code",cost:"Energy --",fn:()=>{change("energy",-28);if(Math.random()>0.45){const e=45+Math.floor(Math.random()*70);change("money",e);log(`Shipped work. ₵${e}.`);}else log("Deep coding. Progress made.");}},
      pitch:{title:"Pitch idea",cost:"Risk/Reward",fn:()=>{if(Math.random()>0.55){change("money",120);change("happy",35);log("Pitch landed!");}else{change("happy",-12);log("Pitch missed. Refine and retry.");}}},
      meetup:{title:"Tech meetup",cost:"Social +++",fn:()=>{change("social",38);change("energy",-16);log("Potential collabs unlocked.");}},
      freelance:{title:"Freelance gig",cost:"Earn ₵60-140",fn:()=>{const e=60+Math.floor(Math.random()*81);change("money",e);change("energy",-32);log(`Gig completed: ₵${e}.`);}},
      worship:{title:"Service",cost:"Happy ++",fn:()=>{change("happy",28);change("social",16);change("energy",-6);log("Spirit lifted.");}},
      fellowship:{title:"Fellowship",cost:"Social ++",fn:()=>{change("social",28);change("happy",16);log("Warm fellowship.");}},
      donate:{title:"Give offering",cost:"₵20",fn:()=>{if(spend(20)){change("happy",18);log("Cheerful giver.");}}},
      pray:{title:"Pray",cost:"Peace +",fn:()=>{change("happy",22);change("energy",6);log("Clarity from quiet prayer.");}},
      shop:{title:"Shop",cost:"₵20-80",fn:()=>{const c=20+Math.floor(Math.random()*61);if(spend(c)){change("happy",20);log(`Spent ₵${c}.`);}}},
      cinema:{title:"Cinema",cost:"₵45",fn:()=>{if(spend(45)){change("happy",30);change("social",8);log("Good film, good escape.");}}},
      foodcourt:{title:"Food court",cost:"₵35",fn:()=>{if(spend(35)){change("hunger",45);change("happy",12);log("Mall food court.");}}},
      window:{title:"People watch",cost:"Free",fn:()=>{change("happy",10);change("social",5);log("Quiet observation.");}},
      trotro_spot:{title:"Trotro life",cost:"Social +",fn:()=>{change("social",15);change("happy",5);log("Classic Accra transport stories.");}},
      street_food:{title:"Street food",cost:"₵10",fn:()=>{if(spend(10)){change("hunger",35);change("happy",8);log("Quick street bite.");}}},
      observe:{title:"Observe city",cost:"Insight",fn:()=>{change("happy",12);log("You watched Accra move.");}},
      side_hustle:{title:"Quick hustle",cost:"Earn ₵12-30",fn:()=>{const e=12+Math.floor(Math.random()*19);change("money",e);change("energy",-14);log(`Quick hustle: ₵${e}.`);}}
    };

    const CAREERS = {
      unemployed:{name:"Unemployed",pay:0,desc:"No steady income. Hustle daily."},
      trader:{name:"Market Trader",pay:35,desc:"Buy low, sell high.",reqMoney:80},
      developer:{name:"Software Developer",pay:70,desc:"Code, ship, earn.",reqMoney:0},
      teacher:{name:"Teacher",pay:45,desc:"Shape the next generation.",reqMoney:0},
      musician:{name:"Musician / Artist",pay:30,desc:"Create and perform.",reqMoney:40},
      driver:{name:"Trotro / Ride Driver",pay:40,desc:"Move Accra.",reqMoney:100},
      student:{name:"Student",pay:10,desc:"Learn now, earn later.",reqMoney:0}
    };

    let state = {name:"New Ghanaian",day:1,time:0,location:"home",career:"unemployed",money:180,hunger:75,energy:85,happy:65,social:45,health:90,log:[]};
    const TIME = ["Morning","Afternoon","Evening","Night"];

    function clamp(v){return Math.max(0,Math.min(100,Math.round(v)));}
    function change(stat,amt){if(stat==="money")state.money=Math.max(0,Math.round(state.money+amt));else state[stat]=clamp(state[stat]+amt);}
    function spend(amt){if(state.money<amt){toast("Not enough ₵!");return false;}state.money-=amt;return true;}
    function log(msg){state.log.unshift(`Day ${state.day}: ${msg}`);if(state.log.length>50)state.log.pop();}
    function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("show"),2600);}

    function advanceTime(hrs=2){
      state.time += Math.ceil(hrs/3.5);
      while(state.time>=4){
        state.time-=4;state.day++;
        change("hunger",-18);change("energy",-8);change("social",-4);change("happy",-3);
        const pay=CAREERS[state.career]?.pay||0;
        if(pay>0){change("money",pay);log(`Career pay: +₵${pay}`);}
        log(`— Day ${state.day} begins —`);
      }
      if(Math.random()<0.18)randomEvent();
      checkCritical();
      render();
    }

    function randomEvent(){
      const events=[
        ()=>{change("money",40);log("Family sent ₵40 via MoMo.");},
        ()=>{change("happy",-18);change("energy",-12);log("Trotro broke down + traffic.");},
        ()=>{change("social",22);log("Ran into an old friend.");},
        ()=>{change("health",-12);log("Mild fever. Rest needed.");},
        ()=>{change("happy",25);log("Favorite highlife song came on.");},
        ()=>{change("money",-18);log("Data + pure water + small chop.");},
        ()=>{change("happy",15);change("social",10);log("Genuine compliment received.");}
      ];
      events[Math.floor(Math.random()*events.length)]();
    }

    function checkCritical(){
      if(state.hunger<=5){change("health",-8);change("energy",-10);toast("Starving! Health dropping.");}
      if(state.energy<=5)toast("Exhausted. Sleep now.");
      if(state.health<=15)toast("Health critical.");
      if(state.happy<=10)toast("Very low mood.");
    }

    function render(){
      document.getElementById("charName").textContent=state.name;
      document.getElementById("charJob").textContent=CAREERS[state.career]?.name||"Unemployed";
      const stats=[
        {key:"money",label:"Money",val:`₵${state.money}`,cls:"money"},
        {key:"hunger",label:"Hunger",val:state.hunger,cls:"hunger"},
        {key:"energy",label:"Energy",val:state.energy,cls:"energy"},
        {key:"happy",label:"Happy",val:state.happy,cls:"happy"},
        {key:"social",label:"Social",val:state.social,cls:"social"},
        {key:"health",label:"Health",val:state.health,cls:"health"}
      ];
      document.getElementById("stats").innerHTML=stats.map(s=>{
        const low=s.key!=="money"&&s.val<20?" low":"";
        const bar=s.key==="money"?"":`<div class="stat-bar"><div class="stat-bar-fill" style="width:${s.val}%"></div></div>`;
        return `<div class="stat ${s.cls}${low}"><div class="stat-label">${s.label}</div><div class="stat-value">${s.val}</div>${bar}</div>`;
      }).join("");
      document.getElementById("dayInfo").textContent=`Day ${state.day} • ${TIME[state.time]}`;
      const loc=LOCATIONS[state.location];
      document.getElementById("locationCard").innerHTML=`<div class="location-emoji">${loc.emoji}</div><div class="location-name">${loc.name}</div><div class="location-desc">${loc.desc}</div>`;
      document.getElementById("actions").innerHTML=loc.actions.map(k=>{
        const a=ACTIONS[k];return `<button class="action-btn" onclick="doAction('${k}')"><span class="title">${a.title}</span><span class="cost">${a.cost}</span></button>`;
      }).join("");
      const c=CAREERS[state.career];
      document.getElementById("careerInfo").textContent=`${c.name}: ${c.desc}${c.pay?` (+₵${c.pay}/day)`:""}`;
      document.getElementById("careerActions").innerHTML=`<button class="small" onclick="showCareerModal()">Switch Career</button>${state.career!=="unemployed"?` <button class="small" onclick="workShift()">Work a shift</button>`:""}`;
      document.getElementById("locationsList").innerHTML=Object.entries(LOCATIONS).map(([k,l])=>`<button class="loc-btn ${k===state.location?"active":""}" onclick="travel('${k}')"><span>${l.emoji}</span><span>${l.name}</span></button>`).join("");
      document.getElementById("log").innerHTML=state.log.slice(0,12).map(e=>`<div class="log-entry">${e}</div>`).join("")||`<div class="log-entry">Your Accra story begins...</div>`;
    }

    function doAction(key){
      if(state.energy<8&&key!=="sleep"){toast("Too tired. Sleep first.");return;}
      if(state.time===3&&key!=="sleep"){toast("It's night. Go home and sleep.");return;}
      ACTIONS[key].fn();
      if(key!=="sleep")advanceTime(2);
      else render();
    }

    function travel(key){
      if(key===state.location)return;
      if(state.energy<10){toast("Too tired to travel.");return;}
      if(state.time===3){toast("Night travel is risky. Sleep first.");return;}
      state.location=key;change("energy",-9);change("money",-4);
      log(`Trotro to ${LOCATIONS[key].name}.`);
      advanceTime(1);
    }

    function workShift(){
      if(state.energy<25){toast("Too tired for a full shift.");return;}
      const pay=Math.round((CAREERS[state.career].pay||20)*1.4);
      change("money",pay);change("energy",-30);change("social",5);
      log(`Worked a shift as ${CAREERS[state.career].name}. +₵${pay}.`);
      advanceTime(4);
    }

    function showCareerModal(){
      document.getElementById("careerOptions").innerHTML=Object.entries(CAREERS).map(([k,c])=>{
        const locked=c.reqMoney&&state.money<c.reqMoney;
        return `<button style="text-align:left;padding:12px" ${locked?"disabled":""} onclick="setCareer('${k}')"><strong>${c.name}</strong>${c.pay?` • ₵${c.pay}/day`:""}<br><span style="font-size:.8rem;color:var(--muted)">${c.desc}${locked?` (Need ₵${c.reqMoney})`:""}</span></button>`;
      }).join("");
      document.getElementById("careerModal").classList.add("show");
    }
    function closeCareerModal(){document.getElementById("careerModal").classList.remove("show");}
    function setCareer(key){
      const c=CAREERS[key];
      if(c.reqMoney&&state.money<c.reqMoney){toast("Not enough money.");return;}
      if(c.reqMoney)change("money",-c.reqMoney);
      state.career=key;log(`You are now a ${c.name}.`);closeCareerModal();render();toast(`Career: ${c.name}`);
    }

    function showSummary(){
      const c=CAREERS[state.career];
      document.getElementById("summaryBody").innerHTML=`
        <strong>${state.name}</strong><br>
        Day ${state.day} • ${c.name}<br><br>
        Money: ₵${state.money}<br>
        Hunger: ${state.hunger} &nbsp; Energy: ${state.energy}<br>
        Happiness: ${state.happy} &nbsp; Social: ${state.social}<br>
        Health: ${state.health}<br><br>
        Current location: ${LOCATIONS[state.location].name}`;
      document.getElementById("summaryModal").classList.add("show");
    }
    function closeSummary(){document.getElementById("summaryModal").classList.remove("show");}

    function promptNewGame(){
      if(state.day>1&&!confirm("Start a new life? Unsaved progress will be lost."))return;
      document.getElementById("nameInput").value="";
      document.getElementById("nameModal").classList.add("show");
      setTimeout(()=>document.getElementById("nameInput").focus(),100);
    }
    function startNewLife(){
      const name=document.getElementById("nameInput").value.trim()||"Ghanaian Hustler";
      state={name,day:1,time:0,location:"home",career:"unemployed",money:180,hunger:75,energy:85,happy:65,social:45,health:90,log:[`Welcome ${name}! Your Accra Life begins.`]};
      document.getElementById("nameModal").classList.remove("show");
      render();toast(`Welcome, ${name}!`);
    }
    function saveGame(){localStorage.setItem("accraLife_v2",JSON.stringify(state));toast("Life saved!");}
    function loadGame(){
      const raw=localStorage.getItem("accraLife_v2")||localStorage.getItem("accraLifeSave");
      if(!raw){toast("No save found.");return;}
      try{state=JSON.parse(raw);if(!state.name)state.name="Ghanaian";if(!state.career)state.career="unemployed";render();toast("Life loaded!");}catch(e){toast("Save error.");}
    }

    if(!localStorage.getItem("accraLife_v2")&&!localStorage.getItem("accraLifeSave")){
      document.getElementById("nameModal").classList.add("show");
    }else{
      const raw=localStorage.getItem("accraLife_v2")||localStorage.getItem("accraLifeSave");
      if(raw){try{state=JSON.parse(raw);if(!state.name)state.name="Ghanaian";if(!state.career)state.career="unemployed";}catch(e){}}
    }
    render();
  </script>
</body>
</html>
