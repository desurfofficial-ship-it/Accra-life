<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>CHALÉ LIFE — Accra</title>
<style>
:root{--gta-black:#0a0a0a;--gta-panel:rgba(8,8,8,.88);--gta-yellow:#ffcc00;--gta-green:#66ff66;--gta-red:#ff3333;--gta-white:#f0f0f0;--gta-muted:#9a9a9a}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#0a0a0a;font-family:Arial Narrow,Arial,Helvetica Neue,sans-serif;color:var(--gta-white)}
#viewportContainer{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#onboardingOverlay{position:fixed;inset:0;z-index:1000;background:radial-gradient(ellipse 100% 70% at 50% 110%,rgba(180,80,20,.4) 0%,transparent 50%),linear-gradient(180deg,#0a0a0a 0%,#1a1208 50%,#2a1a0c 100%);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .35s ease}
#onboardingOverlay.visible{opacity:1;pointer-events:auto}
#onboardingOverlay.exit{opacity:0;transition:opacity .4s ease}
.ob-card{width:100%;max-width:420px;padding:24px 16px;text-align:center}
.ob-screen{display:none;flex-direction:column;align-items:center;gap:14px}
.ob-screen.active{display:flex}
.ob-place{font-size:.75rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gta-yellow);margin:0}
.ob-title{font-size:3.2rem;font-weight:900;color:var(--gta-white);letter-spacing:.04em;margin:0;text-transform:uppercase;line-height:.95;text-shadow:3px 3px 0 #000,-1px -1px 0 #000}
.ob-tagline{font-size:1rem;color:var(--gta-muted);margin:4px 0 12px;line-height:1.4}
.ob-tagline em{color:var(--gta-yellow);font-style:normal;font-weight:800}
.ob-divider{width:60px;height:3px;background:var(--gta-yellow);margin:2px 0 8px}
.ob-btn{width:100%;max-width:320px;border:2px solid transparent;border-radius:2px;padding:14px 24px;font-size:1.05rem;font-weight:900;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;font-family:inherit}
.ob-btn:active{transform:scale(.98)}
.ob-btn-primary{background:var(--gta-yellow);color:#0a0a0a;border-color:#000;box-shadow:4px 4px 0 #000}
.ob-btn-primary:active{box-shadow:2px 2px 0 #000;transform:translate(2px,2px)}
.ob-btn-secondary{background:transparent;color:var(--gta-white);border:2px solid rgba(255,255,255,.35);font-size:.85rem;letter-spacing:.08em;margin-top:4px}
.ob-btn-ghost{background:transparent;color:var(--gta-muted);font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:none;border:none;padding:8px}
.ob-input{width:100%;max-width:320px;background:rgba(0,0,0,.7);border:2px solid rgba(255,204,0,.4);border-radius:2px;padding:12px 14px;font-size:1rem;color:var(--gta-white);outline:none;font-family:inherit}
.ob-input:focus{border-color:var(--gta-yellow)}
.ob-input::placeholder{color:#666}
.ob-error{display:none;color:var(--gta-red);font-size:.8rem;font-weight:800;margin:0}
.ob-error.visible{display:block}
.ob-back{align-self:flex-start;background:none;border:none;color:var(--gta-muted);font-size:.8rem;font-weight:800;cursor:pointer;padding:0;letter-spacing:.06em;text-transform:uppercase;font-family:inherit}
.ob-loading-city{font-size:1.3rem;color:var(--gta-yellow);font-weight:900;margin:0;letter-spacing:.08em;text-transform:uppercase}
.ob-loading-name{font-size:.9rem;color:var(--gta-muted);margin:0}
.ob-spinner{width:36px;height:36px;border:3px solid rgba(255,204,0,.2);border-top-color:var(--gta-yellow);border-radius:50%;animation:obspin .6s linear infinite}
@keyframes obspin{to{transform:rotate(360deg)}}
.ob-chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:340px}
.ob-chip{background:rgba(0,0,0,.65);border:2px solid rgba(255,255,255,.2);color:var(--gta-white);border-radius:0;padding:10px 14px;font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:inherit}
.ob-chip.selected{border-color:var(--gta-yellow);background:rgba(255,204,0,.15);color:var(--gta-yellow)}
.ob-hint{font-size:.75rem;color:var(--gta-muted);margin:0;max-width:320px;line-height:1.35}
.phase1-hud-top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:20;gap:6px}
.hud-left-stack{display:flex;flex-direction:column;gap:4px;max-width:min(200px,48vw);pointer-events:none}
.brand-card{display:none}
.objective-banner{background:var(--gta-panel);border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--gta-green);padding:5px 8px;pointer-events:auto;box-shadow:2px 2px 0 rgba(0,0,0,.4);display:none}
.wallet-diag-body.collapsed{display:none}
.obj-desc{display:none}
.hud-right-stack{display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
.hud-top-actions{display:flex;align-items:center;gap:4px;pointer-events:auto}
.wallet-chip{background:var(--gta-panel);border:1px solid rgba(102,255,102,.45);padding:4px 8px;font-weight:900;font-size:.95rem;color:var(--gta-green);box-shadow:2px 2px 0 #000;pointer-events:auto;cursor:pointer}
.wallet-label{display:none}
.jobs-btn,.cam-btn{background:var(--gta-yellow);color:#0a0a0a;border:1px solid #000;padding:5px 10px;font-weight:900;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:2px 2px 0 #000;font-family:inherit}
.cam-btn{background:#1a1a1a;color:var(--gta-white);border-color:rgba(255,255,255,.25)}
.needs-stack{display:flex;flex-direction:column;gap:2px;background:var(--gta-panel);border:1px solid rgba(255,255,255,.1);padding:4px 6px;min-width:88px}
.need-row{display:flex;align-items:center;gap:4px;font-size:.65rem;font-weight:800}
.need-bar{flex:1;height:4px;background:#222;overflow:hidden}
.need-fill{height:100%;background:var(--gta-green)}
.need-fill.low{background:var(--gta-red)}
.heat-pill{font-size:.65rem;font-weight:800;color:var(--gta-muted);padding:2px 6px}
#interactionPrompt{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--gta-panel);border:1px solid rgba(255,204,0,.5);padding:6px 12px;z-index:25;pointer-events:none;opacity:0;transition:opacity .15s;text-align:center;box-shadow:2px 2px 0 #000}
#interactionPrompt.visible{opacity:1}
#promptTitle{font-size:.85rem;font-weight:900;color:var(--gta-yellow);margin:0}
.prompt-sub{display:none}
#interactionToast{position:fixed;left:50%;top:20%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.2);padding:8px 14px;z-index:30;opacity:0;transition:opacity .2s;font-size:.85rem;font-weight:800;max-width:90vw;text-align:center}
#interactionToast.visible{opacity:1}
#walletDeltaFloating{position:fixed;left:50%;top:28%;transform:translateX(-50%);font-size:1.1rem;font-weight:900;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#walletDeltaFloating.visible{opacity:1;transform:translateX(-50%) translateY(-12px)}
#walletDeltaFloating.pos{color:var(--gta-green)}
#walletDeltaFloating.neg{color:var(--gta-red)}
.economy-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}
.economy-modal-backdrop.open{display:flex}
.economy-modal{background:#111;border:2px solid rgba(255,204,0,.4);width:100%;max-width:420px;max-height:85vh;overflow:auto;box-shadow:6px 6px 0 #000}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.modal-header h2{margin:0;font-size:1rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.modal-close{background:none;border:none;color:var(--gta-muted);font-size:1.2rem;cursor:pointer}
.modal-tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.1)}
.modal-tab-btn{flex:1;background:#0a0a0a;border:none;color:var(--gta-muted);padding:10px;font-weight:900;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;font-family:inherit}
.modal-tab-btn.active{color:var(--gta-yellow);border-bottom:2px solid var(--gta-yellow)}
.modal-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.job-card{background:#1a1a1a;border:1px solid rgba(255,255,255,.12);padding:10px;display:flex;flex-direction:column;gap:6px}
.job-card h3{margin:0;font-size:.9rem;font-weight:900}
.job-card p{margin:0;font-size:.75rem;color:var(--gta-muted)}
.job-card button{align-self:flex-start;background:var(--gta-yellow);color:#0a0a0a;border:none;padding:6px 12px;font-weight:900;font-size:.75rem;cursor:pointer;text-transform:uppercase;font-family:inherit}
.home-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:55;padding:0}
.home-modal-backdrop.open{display:flex}
.home-sheet{background:#111;border-top:3px solid var(--gta-yellow);width:100%;max-width:480px;max-height:70vh;overflow:auto;padding:14px;box-shadow:0 -4px 0 #000}
.home-sheet h2{margin:0 0 8px;font-size:1rem;font-weight:900;text-transform:uppercase}
.furn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.furn-card{background:#1a1a1a;border:1px solid rgba(255,255,255,.12);padding:8px;display:flex;flex-direction:column;gap:4px}
.furn-card h3{margin:0;font-size:.8rem;font-weight:900}
.furn-card p{margin:0;font-size:.7rem;color:var(--gta-muted)}
.furn-card button{background:var(--gta-yellow);color:#0a0a0a;border:none;padding:6px;font-weight:900;font-size:.7rem;cursor:pointer;text-transform:uppercase;font-family:inherit}
.touch-controls{position:fixed;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px;pointer-events:none;z-index:15}
.joystick-zone{width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);pointer-events:auto;position:relative}
.joystick-knob{width:44px;height:44px;border-radius:50%;background:rgba(255,204,0,.85);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #000}
.action-buttons-right{display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.ctrl-btn{background:rgba(0,0,0,.7);border:2px solid rgba(255,255,255,.25);color:var(--gta-white);padding:12px 16px;font-weight:900;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;font-family:inherit;min-width:64px}
.ctrl-btn:active{border-color:var(--gta-yellow);color:var(--gta-yellow)}
</style>
</head>
<body>
<div id="viewportContainer"></div>
<div id="onboardingOverlay">
  <div class="ob-card">
    <div id="obScreenWelcome" class="ob-screen active">
      <p class="ob-place">ACCRA</p>
      <h1 class="ob-title">CHALÉ<br/>LIFE</h1>
      <div class="ob-divider"></div>
      <p class="ob-tagline">Your second life in the capital.<br/><em>Earn. Eat. Rest. Flex.</em></p>
      <button id="obBtnGuest" class="ob-btn ob-btn-primary" type="button">Enter Accra</button>
      <button id="obBtnAccount" class="ob-btn ob-btn-secondary" type="button">Save Progress</button>
    </div>
    <div id="obScreenAuth" class="ob-screen">
      <button id="obBackFromAuth" class="ob-back" type="button">← Back</button>
      <h2 id="obAuthTitle" class="ob-title" style="font-size:1.6rem">Keep Your Story</h2>
      <input id="obEmailInput" class="ob-input" type="email" placeholder="Email" autocomplete="email"/>
      <input id="obPasswordInput" class="ob-input" type="password" placeholder="Password (min 6)" autocomplete="new-password"/>
      <p id="obError" class="ob-error"></p>
      <button id="obAuthSubmit" class="ob-btn ob-btn-primary" type="button">Create Account</button>
      <button id="obAuthToggle" class="ob-btn ob-btn-ghost" type="button">Already have an account? Sign in</button>
    </div>
    <div id="obScreenName" class="ob-screen">
      <button id="obBackFromName" class="ob-back" type="button">← Back</button>
      <p class="ob-place">WHO YOU BE</p>
      <h2 class="ob-title" style="font-size:1.6rem">Your Name</h2>
      <input id="obNameInput" class="ob-input" type="text" placeholder="e.g. Kofi, Ama, Chale…" maxlength="24" autocomplete="nickname"/>
      <p id="obNameError" class="ob-error"></p>
      <button id="obBtnNameNext" class="ob-btn ob-btn-primary" type="button">Next</button>
    </div>
    <div id="obScreenLook" class="ob-screen">
      <button id="obBackFromLook" class="ob-back" type="button">← Back</button>
      <p class="ob-place">LOOK</p>
      <h2 class="ob-title" style="font-size:1.6rem">Skin & Hair</h2>
      <p class="ob-hint">Pick skin tone</p>
      <div id="obSkinRow" class="ob-chip-row"></div>
      <p class="ob-hint">Pick hair</p>
      <div id="obHairRow" class="ob-chip-row"></div>
      <button id="obBtnLookNext" class="ob-btn ob-btn-primary" type="button" style="margin-top:12px">Next</button>
    </div>
    <div id="obScreenTrait" class="ob-screen">
      <button id="obBackFromTrait" class="ob-back" type="button">← Back</button>
      <p class="ob-place">TRAIT</p>
      <h2 class="ob-title" style="font-size:1.6rem">How You Move</h2>
      <div id="obTraitRow" class="ob-chip-row"></div>
      <button id="obBtnTraitNext" class="ob-btn ob-btn-primary" type="button" style="margin-top:12px">Next</button>
    </div>
    <div id="obScreenOrigin" class="ob-screen">
      <button id="obBackFromOrigin" class="ob-back" type="button">← Back</button>
      <p class="ob-place">ORIGIN</p>
      <h2 class="ob-title" style="font-size:1.6rem">Where You Start</h2>
      <div id="obOriginRow" class="ob-chip-row"></div>
      <button id="obBtnOriginGo" class="ob-btn ob-btn-primary" type="button" style="margin-top:12px">Enter Accra</button>
    </div>
    <div id="obScreenLoading" class="ob-screen">
      <div class="ob-spinner"></div>
      <p class="ob-loading-city">Loading Accra…</p>
      <p id="obLoadingName" class="ob-loading-name"></p>
    </div>
  </div>
</div>
<div class="phase1-hud-top">
  <div class="hud-left-stack">
    <div id="activeObjectiveBanner" class="objective-banner">
      <div id="objTag" style="font-size:.65rem;font-weight:800;color:var(--gta-green)"></div>
      <div id="objTitle" style="font-size:.8rem;font-weight:900"></div>
      <div id="objDesc" class="obj-desc"></div>
      <button id="cancelObjectiveBtn" type="button" style="display:none;margin-top:4px;background:none;border:1px solid rgba(255,255,255,.2);color:var(--gta-muted);font-size:.65rem;padding:2px 6px;cursor:pointer">Cancel</button>
    </div>
  </div>
  <div class="hud-right-stack">
    <div class="hud-top-actions">
      <button id="walletOpenBtn" class="wallet-chip" type="button"><span id="hudCashAmount">₵0</span></button>
      <button id="workMenuOpenBtn" class="jobs-btn" type="button">Jobs</button>
      <button id="resetCameraBtn" class="cam-btn" type="button">Cam</button>
    </div>
    <div class="needs-stack">
      <div class="need-row"><span>H</span><div class="need-bar"><div id="hungerFill" class="need-fill" style="width:70%"></div></div><span id="hungerVal">70</span></div>
      <div class="need-row"><span>E</span><div class="need-bar"><div id="energyFill" class="need-fill" style="width:80%"></div></div><span id="energyVal">80</span></div>
    </div>
    <div id="heatStatusPill" class="heat-pill"><span id="heatStatusText">◆ CLEAN</span></div>
  </div>
</div>
<div id="interactionPrompt"><p id="promptTitle"></p><p id="promptSub" class="prompt-sub"></p></div>
<div id="interactionToast"></div>
<div id="walletDeltaFloating"></div>
<div id="economyModalBackdrop" class="economy-modal-backdrop">
  <div class="economy-modal">
    <div class="modal-header"><h2 id="modalHeaderTitle">Work</h2><button id="modalCloseBtn" class="modal-close" type="button">×</button></div>
    <div class="modal-tabs">
      <button class="modal-tab-btn active" data-tab="jobs" type="button">Jobs</button>
      <button class="modal-tab-btn" data-tab="hustles" type="button">Hustles</button>
      <button class="modal-tab-btn" data-tab="spend" type="button">Spend</button>
      <button class="modal-tab-btn" data-tab="wallet" type="button">Wallet</button>
    </div>
    <div id="modalBodyContent" class="modal-body"></div>
  </div>
</div>
<div id="homeModalBackdrop" class="home-modal-backdrop">
  <div class="home-sheet">
    <h2>My Compound</h2>
    <p id="homeFlexScore" style="font-size:.75rem;color:var(--gta-muted);margin:0 0 8px">Flex score: 0</p>
    <div id="furnGrid" class="furn-grid"></div>
    <button id="homeModalClose" type="button" style="margin-top:10px;width:100%;background:#222;color:#fff;border:1px solid #444;padding:10px;font-weight:900;cursor:pointer">Close</button>
  </div>
</div>
<div class="touch-controls"><div id="joystickZone" class="joystick-zone"><div id="joystickKnob" class="joystick-knob"></div></div><div class="action-buttons-right"><button id="sprintToggleBtn" class="ctrl-btn" type="button">Jog</button><button id="interactTriggerBtn" class="ctrl-btn" type="button">Act</button></div></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
